name: Validate and Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validation:
    name: Validate application
    outputs:
      wrangler-version: ${{ steps.wrangler.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Package self-contained Cloudflare worker
        run: |
          npx --no-install wrangler pages functions build --build-output-directory .svelte-kit/cloudflare --outdir .svelte-kit/cloudflare-worker --compatibility-flags nodejs_compat
          cp .svelte-kit/cloudflare-worker/_worker.js .svelte-kit/cloudflare/_worker.js
      - name: Record validated Wrangler version
        id: wrangler
        run: echo "version=$(node -p "require('wrangler/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:browser
      - name: Upload validated build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validated-cloudflare-build
          path: .svelte-kit/cloudflare
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  deploy-preview:
    name: Deploy Preview
    needs: validation
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Download validated build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: validated-cloudflare-build
          path: ${{ runner.temp }}/cloudflare-deploy/site
      - name: Initialize isolated deployment tooling
        run: echo '{}' > "${{ runner.temp }}/cloudflare-deploy/package.json"
      - name: Deploy preview
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          workingDirectory: ${{ runner.temp }}/cloudflare-deploy
          wranglerVersion: ${{ needs.validation.outputs.wrangler-version }}
          packageManager: npm
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --commit-hash=${{ github.sha }} --project-name=lakitu-dev-tools --branch=${{ github.event.pull_request.head.ref }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy-production:
    name: Deploy Production
    needs: validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Download validated build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: validated-cloudflare-build
          path: ${{ runner.temp }}/cloudflare-deploy/site
      - name: Initialize isolated deployment tooling
        run: echo '{}' > "${{ runner.temp }}/cloudflare-deploy/package.json"
      - name: Deploy production
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          workingDirectory: ${{ runner.temp }}/cloudflare-deploy
          wranglerVersion: ${{ needs.validation.outputs.wrangler-version }}
          packageManager: npm
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --commit-hash=${{ github.sha }} --project-name=lakitu-dev-tools --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  bundle-size:
    name: Check Bundle Size
    needs: validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download validated build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: validated-cloudflare-build
          path: current-build
      - name: Checkout base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: baseline/package-lock.json
      - name: Build baseline
        working-directory: baseline
        run: |
          npm ci
          npm run build
          npx --no-install wrangler pages functions build --build-output-directory .svelte-kit/cloudflare --outdir .svelte-kit/cloudflare-worker --compatibility-flags nodejs_compat
          cp .svelte-kit/cloudflare-worker/_worker.js .svelte-kit/cloudflare/_worker.js
      - name: Compare compressed bundle sizes
        run: python3 scripts/bundle-size.py baseline/.svelte-kit/cloudflare current-build >> "$GITHUB_STEP_SUMMARY"
