name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Combined build and deploy preview for pull requests
  build-and-deploy-preview:
    name: Build and Deploy Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit (non-blocking for Renovate)
        if: github.event.pull_request.user.login == 'renovate[bot]'
        run: npm audit --audit-level=high || true

      - name: Security audit
        if: github.event.pull_request.user.login != 'renovate[bot]'
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run check

      - name: Build project
        run: npm run build

      - name: Deploy to Cloudflare Pages (Preview)
        id: deploy
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name=lakitu-dev-tools --branch=${{ github.event.pull_request.head.ref }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  # Combined build and deploy job for pushes to main
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build project
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name=lakitu-dev-tools
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
